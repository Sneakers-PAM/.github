# The shared release-drafter config for every Sneakers-PAM repository. Each repo's
# job-release-drafter.yaml reads it with `extends: Sneakers-PAM/.github@<sha>`, so
# the categories, version resolver and autolabeler live in one place. The autolabeler
# derives the categorizing label from the conventional-commit PR title;
# job-label-checker is the backstop.
#
# Categories carry their own `when` conditions and `semver-increment`, and a
# `pre-exclude` category drops skip-changelog pull requests: the new-format
# replacement for the deprecated per-category `labels` shorthand, the
# top-level `exclude-labels` and the `version-resolver` block
# (release-drafter/release-drafter#1558).
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
template: |
  # What Changed 👀

  $CHANGES

  # Extra

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
categories:
  - type: pre-exclude
    when:
      - labels: [skip-changelog]
  - title: 💥 Breaking Changes
    semver-increment: major
    when:
      - labels: [breaking]
  - title: 🚀 Features
    semver-increment: minor
    when:
      - labels: [enhancement]
  - title: 🐛 Bug Fixes
    when:
      - labels: [bug, fix]
  - title: ⚡ Performance
    when:
      - labels: [performance]
  - title: ⚠️ Changes
    when:
      - labels: [refactor, changed]
  - title: ⛔️ Deprecated
    when:
      - labels: [deprecated]
  - title: 🗑 Removed
    when:
      - labels: [removed]
  - title: 🔐 Security
    when:
      - labels: [security]
  - title: 📄 Documentation
    when:
      - labels: [documentation]
  - title: 🧩 Dependency Updates
    collapse-after: 5
    when:
      - labels: [dependencies]
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
# Bot authors render as `@name[bot]`, which GitHub markdown does not autolink
# (the bracketed login is not a valid mention). Rewrite the common ones to a
# real link so the credit is clickable instead of plain text.
replacers:
  - search: '/@github-actions\[bot\]/g'
    replace: '[@github-actions](https://github.com/apps/github-actions)'
autolabeler:
  - label: breaking
    title:
      - '/^[a-z]+(\(.+\))?!:/'
      - '/BREAKING[ -]CHANGE/'
  - label: enhancement
    title: ['/^feat(\(.+\))?:/']
  - label: fix
    title: ['/^fix(\(.+\))?:/']
  - label: performance
    title: ['/^perf(\(.+\))?:/']
  - label: refactor
    title: ['/^refactor(\(.+\))?:/']
  - label: documentation
    title: ['/^docs(\(.+\))?:/']
  - label: dependencies
    title:
      - '/^build(\(.+\))?:/'
      - '/^chore\(deps.*\):/'
  - label: security
    title: ['/^security(\(.+\))?:/']
  - label: skip-changelog
    title:
      - '/^(ci|test|style)(\(.+\))?:/'
      - '/^chore(?!\(deps)(\(.+\))?:/'
